spring.application.name=ai-email-assistant

# ─────────────────────────────────────────────────────────────────────────────
# Google Generative AI (Gemini) — via Spring AI
# Replaces the previous manual gemini.api.url / gemini.api.key + WebClient setup.
# The starter auto-configures:
#   • ChatClient.Builder  (used by EmailGeneratorService)
#   • EmbeddingModel      (used by MongoDBAtlasVectorStore internally)
# ─────────────────────────────────────────────────────────────────────────────
spring.ai.google.genai.api-key=${GEMINI_KEY}

# Chat model — Gemini 2.0 Flash is fast and cost-effective for reply generation
spring.ai.google.genai.chat.options.model=gemini-2.0-flash

# Embedding model — text-embedding-004 produces 768-dimensional vectors
spring.ai.google.genai.embedding.options.model=text-embedding-004


# ─────────────────────────────────────────────────────────────────────────────
# MongoDB Atlas
# Set MONGODB_URI in your environment or .env file, e.g.:
#   MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/?retryWrites=true&w=majority
# ─────────────────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:email_assistant_db}


# ─────────────────────────────────────────────────────────────────────────────
# Spring AI — MongoDB Atlas Vector Store
#
# Prerequisites (must be done once in the Atlas UI / Atlas CLI):
#   1. Create collection "email_embeddings" in the database above.
#   2. Create a Vector Search index named "vector_index" on that collection:
#      {
#        "fields": [
#          { "type": "vector", "path": "embedding", "numDimensions": 768,
#            "similarity": "cosine" },
#          { "type": "filter", "path": "metadata.userId" },
#          { "type": "filter", "path": "metadata.emailType" }
#        ]
#      }
#   Spring Boot will NOT create this index automatically
#   (initialize-schema=false below).
# ─────────────────────────────────────────────────────────────────────────────
spring.ai.vectorstore.mongodb.collection-name=email_embeddings
spring.ai.vectorstore.mongodb.index-name=vector_index

# The MongoDB document field that stores the embedding vector
spring.ai.vectorstore.mongodb.path-name=embedding

# Do not attempt to auto-create the collection or index on startup —
# the Atlas Vector Search index must be created via the Atlas UI.
spring.ai.vectorstore.mongodb.initialize-schema=false

# Metadata fields that can be used in filter expressions during similarity search.
# These must match the "filter" entries in your Atlas Vector Search index definition.
spring.ai.vectorstore.mongodb.metadata-fields-to-filter=userId,emailType
