<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #020617; /* slate-950 */
      --glass-bg: rgba(15, 23, 42, 0.4); /* slate-900/40 */
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9; /* slate-100 */
      --text-muted: #94a3b8; /* slate-400 */
      --accent-solid: #4f46e5; /* indigo-600 */
      --accent-hover: #6366f1; /* indigo-500 */
      --gradient-start: #38bdf8; /* sky-400 */
      --gradient-mid: #a855f7; /* purple-400 */
      --gradient-end: #818cf8; /* indigo-400 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      width: 320px;
      min-height: 250px;
      margin: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Animated Gradient Background */
    .bg-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 50%, rgba(79, 70, 229, 0.25), transparent 40%),
                  radial-gradient(circle at 90% 20%, rgba(147, 51, 234, 0.25), transparent 40%),
                  radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.25), transparent 40%);
      z-index: 0;
    }

    /* Glassmorphism Container */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      height: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    /* Title Styling */
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, var(--gradient-end), var(--gradient-mid), var(--gradient-start));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      text-align: center;
    }

    p {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Decorative icon container */
    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(79, 70, 229, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      border: 1px solid rgba(79, 70, 229, 0.3);
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.2);
    }

    .icon-wrapper svg {
      width: 24px;
      height: 24px;
      stroke: var(--gradient-start);
    }

    /* Status indicator */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .status-dot.disabled {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }

    /* Controls Section */
    .controls {
      width: 100%;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Toggle Switch */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }
    .toggle-label {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .4s;
      border-radius: 34px;
      border: 1px solid var(--glass-border);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text-muted);
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: var(--accent-solid);
      border-color: var(--accent-solid);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: white;
    }

    /* Link Button */
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-link:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }
    .btn-link svg {
      width: 18px;
      height: 18px;
    }

    /* Custom Instructions Textarea */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .input-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }
    .custom-textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      resize: none;
      height: 80px;
      transition: all 0.2s;
    }
    .custom-textarea:focus {
      outline: none;
      border-color: var(--accent-solid);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }
    .custom-textarea::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
      </svg>
    </div>
    
    <h1>AI Email Assistant</h1>
    <p>Your intelligent reply generator is active and ready to assist you in Gmail.</p>
    
    <div class="status-badge" id="statusBadge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Extension Active</span>
    </div>

    <div class="controls">
      <div class="toggle-row">
        <span class="toggle-label">Enable in Gmail</span>
        <label class="switch">
          <input type="checkbox" id="enableToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="input-group">
        <label class="input-label" for="popupCustomInstructions">Global Custom Instructions</label>
        <textarea id="popupCustomInstructions" class="custom-textarea" placeholder="e.g., Always sign off with 'Best, Gamika'"></textarea>
      </div>

      <a href="http://localhost:5173" target="_blank" class="btn-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
        Open Web App
      </a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
